# duty 前后端容器化编排示例（专题四参考）
#
# 使用：
#   cd 项目参考
#   docker compose up --build
# 后端：http://localhost:8000/docs
# 前端：http://localhost:8501
#
# 说明：
# - 后端镜像首次启动自动建表并写入教学演示数据（admin/admin123、四表记录）；
# - 认证为简单令牌（hashlib 盐哈希 + 内存字典），无 SECRET_KEY / ALGORITHM；
# - 前端通过 DUTY_API_BASE_URL 访问后端，容器间使用服务名 backend。

name: duty-system

services:
  backend:
    build:
      context: ./duty-simplified
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./duty.db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./duty_frontend
    ports:
      - "8501:8501"
    environment:
      # 容器内用服务名访问后端，不是 localhost
      DUTY_API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
